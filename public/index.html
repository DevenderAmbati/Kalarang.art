<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#12151a" />
    <meta
      name="description"
      content="Kalarang has moved on. Continue discovering and commissioning art in the BrushOwl app."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kalarang" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet" />
    <title>Kalarang</title>
    <style>
      /* Prevent browser pull-to-refresh globally */
      html, body {
        overscroll-behavior-y: contain;
        overscroll-behavior-x: none;
      }
      
      /* iOS Safari/PWA specific overscroll prevention */
      @supports (-webkit-touch-callout: none) {
        html, body {
          position: fixed;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        #root {
          position: fixed;
          width: 100%;
          height: 100%;
          overflow-y: auto;
          overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior-y: none;
        }
      }
      
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a132c;
        overflow: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash-screen.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-video {
        position: relative;
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 100vh;
        object-fit: contain;
        background: transparent;
      }

      /* Tablet: larger splash video */
      @media (min-width: 640px) {
        .splash-video {
          width: auto;
          height: 90vh;
          max-width: 100vw;
        }
      }

      /* Desktop: nearly full viewport height */
      @media (min-width: 1024px) {
        .splash-video {
          height: 96vh;
          max-width: 100vw;
        }
      }

      .splash-loader {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        overflow: hidden;
        z-index: 2;
      }
      .splash-loader-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #2FA4A9, #5FD1D8, #1E4FA3, transparent);
        animation: splash-loader-slide 1.5s ease-in-out infinite;
      }

      @keyframes splash-loader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body style="margin:0;background:#0a132c">
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="splash-screen">
      <video
        class="splash-video"
        src="%PUBLIC_URL%/splashscreen.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('splash-screen');
        var isNative =
          window.Capacitor &&
          typeof window.Capacitor.isNativePlatform === 'function' &&
          window.Capacitor.isNativePlatform();

        // Web / PWA never shows the BrushOwl splash — keeps Kalarang migration clean.
        if (!isNative) {
          if (splash) splash.remove();
          document.body.style.background = '';
          return;
        }

        if (sessionStorage.getItem('brushowl-splash-shown')) {
          if (splash) splash.remove();
          document.body.style.background = '';
        } else {
          sessionStorage.setItem('brushowl-splash-shown', '1');
          var video = document.querySelector('.splash-video');
          if (video) {
            var playPromise = video.play();
            if (playPromise && typeof playPromise.catch === 'function') {
              playPromise.catch(function () {});
            }
          }
        }
      })();
    </script>

    <div id="root"></div>
  </body>
</html>
